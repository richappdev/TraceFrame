name: Daily production smoke

on:
  schedule:
    # 09:00 Asia/Taipei (UTC+8). Scheduled runs may start later under load.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: Production origin to check
        required: true
        type: string
        default: https://antiable-anipin.web.app

permissions:
  contents: read

concurrency:
  group: daily-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANIPINS_URL: ${{ inputs.target_url || 'https://antiable-anipin.web.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        run: npm run smoke:daily

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-smoke-${{ github.run_id }}
          path: reports/daily-smoke/
          if-no-files-found: warn
          retention-days: 7
